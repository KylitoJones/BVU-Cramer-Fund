name: Update prices

on:
  schedule:
    # 21:45 UTC = 5:45 pm EDT / 4:45 pm EST, Monday–Friday (after the 4 pm close)
    - cron: "45 21 * * 1-5"
  workflow_dispatch:      # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet yfinance pandas

      - name: Fetch closing prices
        run: python scripts/update_prices.py

      - name: Commit data/prices.json
        run: |
          git config user.name "cramer-fund-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "Update prices $(date -u +%Y-%m-%d)"
            git push
          fi
